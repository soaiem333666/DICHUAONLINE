<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Chùa Online - Dâng Hương & Cầu An Trực Tuyến</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Nâng Cấp: Cinzel, Playfair Display & Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background: radial-gradient(circle at center, #2e1605 0%, #120702 70%, #050201 100%);
            color: #fce7f3;
            min-height: 100vh;
        }
        .font-sans-custom {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        
        /* Hiệu ứng chữ ánh kim Vàng Son (Gold Text Effect) */
        .gold-text {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 40%, #fbbf24 70%, #fef3c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 8px rgba(245, 158, 11, 0.4));
        }

        /* Hiệu ứng Hào Quang Phật */
        .halo-effect {
            box-shadow: 0 0 70px 25px rgba(234, 179, 8, 0.5), 0 0 120px 50px rgba(245, 158, 11, 0.25);
            animation: pulse-halo 5s infinite alternate ease-in-out;
        }
        @keyframes pulse-halo {
            0% { transform: scale(0.98); box-shadow: 0 0 50px 15px rgba(234, 179, 8, 0.4), 0 0 90px 30px rgba(245, 158, 11, 0.2); }
            100% { transform: scale(1.02); box-shadow: 0 0 90px 35px rgba(234, 179, 8, 0.7), 0 0 140px 60px rgba(245, 158, 11, 0.35); }
        }

        /* Hiệu ứng Ngọn Nến Lung Linh */
        .flame {
            width: 14px;
            height: 26px;
            background: linear-gradient(to top, #ff4500, #ffa500, #ffff00, #ffffff);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.1s infinite alternate;
            box-shadow: 0 0 18px #ffa500, 0 0 30px #ff4500;
        }
        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
        }

        /* Canvas Khói Hương */
        #incenseCanvas {
            pointer-events: none;
        }

        /* Animation niệm Phật nảy lên */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-90px) scale(1.2); }
        }
        .floating-text {
            position: absolute;
            animation: floatUp 1.8s ease-out forwards;
            pointer-events: none;
            color: #fef08a;
            font-weight: bold;
            font-family: 'Be Vietnam Pro', sans-serif;
            text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 14px rgba(234,179,8,0.9);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1c140e;
        }
        ::-webkit-scrollbar-thumb {
            background: #b45309;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen relative overflow-x-hidden">

    <!-- Canvas Hiệu Ứng Khói Hương -->
    <canvas id="incenseCanvas" class="absolute inset-0 z-10 w-full h-full"></canvas>

    <!-- Header / Tiêu Đề Trang -->
    <header class="relative z-20 text-center py-7 px-4 bg-black/60 backdrop-blur-md border-b border-amber-800/60 shadow-2xl">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider font-cinzel gold-text drop-shadow-[0_4px_12px_rgba(217,119,6,0.6)]">
            🙏 ĐI CHÙA ONLINE 🙏
        </h1>
        <p class="text-sm md:text-base text-amber-200/90 mt-2 font-sans-custom italic tracking-wide">
            Tĩnh Tâm - Dâng Hương - Cầu An - Tích Tụ Công Đức
        </p>
    </header>

    <!-- Nội Dung Chính -->
    <main class="relative z-20 flex-grow max-w-6xl mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Cột Trái: Trình Phát Nhạc & Các Nghi Lễ Tâm Linh -->
        <section class="lg:col-span-4 space-y-6">
            
            <!-- Trình Phát Nhạc Phật / YouTube Autoplay Embed Player -->
            <div class="bg-gradient-to-b from-amber-950/80 to-black/90 border border-amber-700/60 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
                <div class="flex items-center justify-between mb-3 border-b border-amber-800/50 pb-2">
                    <h2 class="text-lg font-bold text-amber-300 font-cinzel flex items-center gap-2">
                        <i class="fa-solid fa-music text-amber-400"></i> Nhạc Phật Tĩnh Tâm
                    </h2>
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-900/90 text-amber-200 border border-amber-500/50 font-sans-custom font-semibold">Tự Động Phát</span>
                </div>
                
                <!-- Iframe YouTube Player tự động phát -->
                <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-2xl border border-amber-700/60 bg-black">
                    <iframe 
                        class="w-full h-full"
                        src="https://www.youtube.com/embed/T3vF3jCsJ0w?autoplay=1&mute=1&enablejsapi=1" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>
                </div>
                <p class="text-xs text-amber-300/80 mt-2 text-center font-sans-custom">
                    Nhạc tự động phát. Hãy bật loa thiết bị để lắng nghe giai điệu tĩnh tâm.
                </p>
            </div>

            <!-- Công Cụ Tâm Linh: Chuông Mõ -->
            <div class="bg-gradient-to-b from-amber-950/80 to-black/90 border border-amber-700/60 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
                <h2 class="text-lg font-bold text-amber-300 font-cinzel mb-4 text-center border-b border-amber-800/50 pb-2">
                    <i class="fa-solid fa-bell text-amber-400"></i> Tự Tay Tụng Niệm
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Nút Gõ Mõ -->
                    <button id="btnKnockWood" onclick="playWoodBlock(event)" class="flex flex-col items-center justify-center p-4 bg-gradient-to-b from-amber-900/90 via-amber-950/90 to-black hover:from-amber-800 hover:to-amber-900 border border-amber-600/70 rounded-xl shadow-xl active:scale-95 transition">
                        <div class="text-4xl mb-2">🪵</div>
                        <span class="font-bold text-amber-200 font-sans-custom">Gõ Mõ</span>
                        <span class="text-xs text-amber-400/90 mt-1 font-sans-custom">Công Đức +1</span>
                    </button>
                    <!-- Nút Thỉnh Chuông -->
                    <button id="btnRingBell" onclick="playTempleBell()" class="flex flex-col items-center justify-center p-4 bg-gradient-to-b from-amber-900/90 via-amber-950/90 to-black hover:from-amber-800 hover:to-amber-900 border border-amber-600/70 rounded-xl shadow-xl active:scale-95 transition">
                        <div class="text-4xl mb-2">🔔</div>
                        <span class="font-bold text-amber-200 font-sans-custom">Thỉnh Chuông</span>
                        <span class="text-xs text-amber-400/90 mt-1 font-sans-custom">Tĩnh Tâm</span>
                    </button>
                </div>
                <!-- Đếm số lần gõ mõ -->
                <div class="mt-4 text-center bg-black/70 py-2.5 rounded-lg border border-amber-900/70">
                    <span class="text-xs font-sans-custom text-amber-300/80">Tổng Công Đức Tích Lũy:</span>
                    <span id="meritCount" class="text-xl font-bold text-yellow-400 font-sans-custom ml-2">0</span>
                </div>
            </div>

            <!-- Các Tính Năng Nghi Lễ -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openModal('drawStickModal')" class="p-3.5 bg-gradient-to-r from-amber-900/80 to-amber-950/90 hover:from-amber-800 hover:to-amber-900 border border-amber-700/70 rounded-xl text-amber-200 font-semibold text-xs md:text-sm font-sans-custom flex items-center justify-center gap-2 transition shadow-lg">
                    <i class="fa-solid fa-scroll text-amber-400"></i> Rút Quẻ Xăm
                </button>
                <button onclick="openModal('petitionModal')" class="p-3.5 bg-gradient-to-r from-amber-900/80 to-amber-950/90 hover:from-amber-800 hover:to-amber-900 border border-amber-700/70 rounded-xl text-amber-200 font-semibold text-xs md:text-sm font-sans-custom flex items-center justify-center gap-2 transition shadow-lg">
                    <i class="fa-solid fa-pen-nib text-amber-400"></i> Dâng Sớ Cầu An
                </button>
            </div>

        </section>

        <!-- Cột Phải: Bàn Thờ & Tượng Phật Trang Nghiêm -->
        <section class="lg:col-span-8 flex flex-col items-center relative">
            
            <!-- Chọn Tượng Phật -->
            <div class="mb-5 flex flex-wrap justify-center gap-2 z-20">
                <button onclick="changeBuddha('thichca')" class="px-4 py-1.5 rounded-full bg-amber-900/80 hover:bg-amber-700 border border-amber-500/60 text-xs font-sans-custom text-amber-200 font-medium transition shadow-md">Đức Phật Thích Ca</button>
                <button onclick="changeBuddha('quanam')" class="px-4 py-1.5 rounded-full bg-amber-900/80 hover:bg-amber-700 border border-amber-500/60 text-xs font-sans-custom text-amber-200 font-medium transition shadow-md">Bồ Tát Quán Thế Âm</button>
                <button onclick="changeBuddha('duocsu')" class="px-4 py-1.5 rounded-full bg-amber-900/80 hover:bg-amber-700 border border-amber-500/60 text-xs font-sans-custom text-amber-200 font-medium transition shadow-md">Đức Phật Dược Sư</button>
                <button onclick="changeBuddha('dilac')" class="px-4 py-1.5 rounded-full bg-amber-900/80 hover:bg-amber-700 border border-amber-500/60 text-xs font-sans-custom text-amber-200 font-medium transition shadow-md">Đức Phật Di Lặc</button>
            </div>

            <!-- Khung Bàn Thờ Trang Nghiêm -->
            <div class="relative w-full max-w-2xl bg-gradient-to-b from-amber-950/90 via-amber-950/70 to-black/95 rounded-3xl p-6 md:p-9 border border-amber-700/60 shadow-[0_0_70px_rgba(0,0,0,0.95)] backdrop-blur-md flex flex-col items-center">
                
                <!-- Hào Quang & Tượng Phật Chân Thực -->
                <div class="relative mb-6 flex items-center justify-center">
                    <!-- Hào Quang Background -->
                    <div class="absolute w-60 h-60 md:w-76 md:h-76 rounded-full halo-effect bg-amber-400/25"></div>
                    
                    <!-- Container Hình Tượng Phật Trang Nghiêm -->
                    <div class="relative z-10 w-56 h-56 md:w-68 md:h-68 flex items-center justify-center rounded-2xl overflow-hidden shadow-2xl border-2 border-amber-500/70 bg-black/70 backdrop-blur-sm">
                        <img id="buddhaImage" 
                             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxNtBvtsJuKi3wbY-sRd80U5-_9P8L-6lGeSgx782AmQ&s=10" 
                             alt="Tượng Phật Trang Nghiêm" 
                             onerror="handleImageError(this)"
                             class="w-full h-full object-cover transition-all duration-500 transform hover:scale-105">
                        <div id="fallbackIcon" class="hidden text-7xl md:text-8xl">🧘‍♂️</div>
                    </div>
                </div>

                <!-- Tên Vị Phật -->
                <h3 id="buddhaName" class="text-xl md:text-2xl font-bold font-cinzel text-amber-300 text-center mb-6 tracking-wide drop-shadow-lg">
                    Nam Mô Bổn Sư Thích Ca Mâu Ni Phật
                </h3>

                <!-- Bàn Thờ Cúng Phẩm (Nến, Hương, Trái Cây, Hoa) -->
                <div class="w-full bg-amber-950/95 border-t-4 border-amber-600 rounded-xl p-4 shadow-2xl relative">
                    <div class="flex justify-between items-end px-2 md:px-8">
                        
                        <!-- Nến Bên Trái -->
                        <div class="flex flex-col items-center">
                            <div class="flame"></div>
                            <div class="w-3.5 h-14 bg-gradient-to-b from-red-600 to-red-800 rounded-t-sm shadow-md"></div>
                            <div class="w-9 h-3.5 bg-amber-700 rounded-sm shadow"></div>
                        </div>

                        <!-- Mâm Trái Cây -->
                        <div class="text-3xl md:text-4xl drop-shadow-md" title="Mâm Ngũ Quả">
                            🍎🍊🍌
                        </div>

                        <!-- Bát Hương Trung Tâm -->
                        <div class="relative flex flex-col items-center cursor-pointer" onclick="lightIncense()" title="Bấm để thắp hương">
                            <!-- Que Hương -->
                            <div class="flex gap-1.5 mb-0 z-10">
                                <div id="incenseStick1" class="w-1 h-12 bg-amber-700 rounded-t-full transition-all"></div>
                                <div id="incenseStick2" class="w-1 h-14 bg-amber-600 rounded-t-full transition-all"></div>
                                <div id="incenseStick3" class="w-1 h-12 bg-amber-700 rounded-t-full transition-all"></div>
                            </div>
                            <!-- Bát Hương -->
                            <div class="w-16 h-10 md:w-20 md:h-12 bg-gradient-to-b from-amber-600 via-amber-800 to-amber-950 rounded-b-2xl border-t-2 border-amber-400 flex items-center justify-center shadow-2xl">
                                <span class="text-xs text-amber-300 font-cinzel font-bold">香</span>
                            </div>
                        </div>

                        <!-- Bình Hoa Sen -->
                        <div class="text-3xl md:text-4xl drop-shadow-md" title="Bình Hoa Sen">
                            🪷
                        </div>

                        <!-- Nến Bên Phải -->
                        <div class="flex flex-col items-center">
                            <div class="flame"></div>
                            <div class="w-3.5 h-14 bg-gradient-to-b from-red-600 to-red-800 rounded-t-sm shadow-md"></div>
                            <div class="w-9 h-3.5 bg-amber-700 rounded-sm shadow"></div>
                        </div>

                    </div>
                </div>

                <!-- Các Nút Thắp Hương & Cúng Dường -->
                <div class="mt-7 flex flex-wrap justify-center gap-3">
                    <button onclick="lightIncense()" class="px-6 py-2.5 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-amber-950 font-bold rounded-full shadow-lg transition transform active:scale-95 flex items-center gap-2 font-sans-custom">
                        <i class="fa-solid fa-fire text-red-950"></i> Thắp Th
