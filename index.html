<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Chùa Online - Dâng Hương & Cầu An Trực Tuyến</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Merriweather & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather', serif;
            background: radial-gradient(circle at center, #1a0f07 0%, #080402 100%);
            color: #f3e5ab;
            min-height: 100vh;
        }
        .font-sans-custom {
            font-family: 'Montserrat', sans-serif;
        }
        /* Hiệu ứng Hào Quang Phật */
        .halo-effect {
            box-shadow: 0 0 60px 20px rgba(234, 179, 8, 0.4), 0 0 100px 40px rgba(245, 158, 11, 0.2);
            animation: pulse-halo 4s infinite alternate ease-in-out;
        }
        @keyframes pulse-halo {
            0% { box-shadow: 0 0 50px 15px rgba(234, 179, 8, 0.3), 0 0 90px 30px rgba(245, 158, 11, 0.15); }
            100% { box-shadow: 0 0 80px 30px rgba(234, 179, 8, 0.6), 0 0 120px 50px rgba(245, 158, 11, 0.3); }
        }
        /* Hiệu ứng Ngọn Nến Lung Linh */
        .flame {
            width: 14px;
            height: 24px;
            background: linear-gradient(to top, #ff4500, #ffa500, #ffff00, #ffffff);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.1s infinite alternate;
            box-shadow: 0 0 15px #ffa500, 0 0 25px #ff4500;
        }
        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.08) rotate(2deg); opacity: 1; }
        }
        /* Canvas Khói Hương */
        #incenseCanvas {
            pointer-events: none;
        }
        /* Animation niệm Phật nảy lên */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }
        .floating-text {
            position: absolute;
            animation: floatUp 1.8s ease-out forwards;
            pointer-events: none;
            color: #fef08a;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.8), 0 0 12px rgba(234,179,8,0.8);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1c140e;
        }
        ::-webkit-scrollbar-thumb {
            background: #b45309;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen relative overflow-x-hidden">

    <!-- Canvas Hiệu Ứng Khói Hương -->
    <canvas id="incenseCanvas" class="absolute inset-0 z-10 w-full h-full"></canvas>

    <!-- Header / Tiêu Đề Trang -->
    <header class="relative z-20 text-center py-6 px-4 bg-black/40 backdrop-blur-md border-b border-amber-900/40">
        <h1 class="text-3xl md:text-5xl font-bold tracking-wide text-amber-300 drop-shadow-[0_2px_10px_rgba(217,119,6,0.5)]">
            🙏 ĐI CHÙA ONLINE 🙏
        </h1>
        <p class="text-sm md:text-base text-amber-200/80 mt-2 font-sans-custom italic">
            Tĩnh Tâm - Dâng Hương - Cầu An - Tích Tụ Công Đức
        </p>
    </header>

    <!-- Nội Dung Chính -->
    <main class="relative z-20 flex-grow max-w-6xl mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Cột Trái: Trình Phát Nhạc & Các Nghi Lễ Tâm Linh -->
        <section class="lg:col-span-4 space-y-6">
            
            <!-- Trình Phát Nhạc Phật / YouTube Embed Player -->
            <div class="bg-amber-950/40 border border-amber-700/50 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
                <div class="flex items-center justify-between mb-3 border-b border-amber-800/50 pb-2">
                    <h2 class="text-lg font-bold text-amber-300 flex items-center gap-2">
                        <i class="fa-solid fa-music text-amber-400"></i> Nhạc Phật Tĩnh Tâm
                    </h2>
                    <span class="text-xs px-2 py-0.5 rounded bg-amber-900/60 text-amber-200 border border-amber-600/40 font-sans-custom">YouTube HD</span>
                </div>
                
                <!-- Iframe YouTube Player -->
                <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-lg border border-amber-800/60 bg-black">
                    <iframe 
                        class="w-full h-full"
                        src="https://www.youtube.com/embed/T3vF3jCsJ0w?si=ReZHBC6InUorZl9K" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen>
                    </iframe>
                </div>
                <p class="text-xs text-amber-300/70 mt-2 text-center font-sans-custom">
                    Bấm phát nhạc để thưởng thức giai điệu tĩnh tâm
                </p>
            </div>

            <!-- Công Cụ Tâm Linh: Chuông Mõ -->
            <div class="bg-amber-950/40 border border-amber-700/50 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
                <h2 class="text-lg font-bold text-amber-300 mb-4 text-center border-b border-amber-800/50 pb-2">
                    <i class="fa-solid fa-bell text-amber-400"></i> Tự Tay Tụng Niệm
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Nút Gõ Mõ -->
                    <button id="btnKnockWood" onclick="playWoodBlock(event)" class="flex flex-col items-center justify-center p-4 bg-gradient-to-b from-amber-900/80 to-amber-950/90 hover:from-amber-800 hover:to-amber-900 border border-amber-600/60 rounded-xl shadow-lg active:scale-95 transition">
                        <div class="text-4xl mb-2">🪵</div>
                        <span class="font-bold text-amber-200">Gõ Mõ</span>
                        <span class="text-xs text-amber-400/80 mt-1 font-sans-custom">Công Đức +1</span>
                    </button>
                    <!-- Nút Thỉnh Chuông -->
                    <button id="btnRingBell" onclick="playTempleBell()" class="flex flex-col items-center justify-center p-4 bg-gradient-to-b from-amber-900/8
